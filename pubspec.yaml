name: oneiro
description: "Oneiro — an open-source dream journal for lucid dreamers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management / DI
  flutter_riverpod: ^2.6.1
  # Local persistence
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.3
  path: ^1.9.0
  # Formatting & utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.19.0
  # Navigation
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
