name: oneiro
description: "Oneiro — an open-source dream journal for lucid dreamers."
publish_to: 'none'
version: 1.2.4+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management / DI
  flutter_riverpod: ^2.6.1
  # Local persistence
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.3
  path: ^1.9.0
  # Formatting & utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.19.0
  # Navigation
  go_router: ^14.6.2
  flutter_local_notifications: ^20.1.0
  audioplayers: ^6.6.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.0
  fl_chart: 1.0.0
  # Backup & import (behind thin interfaces)
  file_picker: ^10.1.2
  share_plus: ^11.0.0
  # Encrypted sync (OVault v1): KDF + AEAD, WebDAV transport, credential vault
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  webdav_client: ^1.2.2
  dio: ^5.10.0
  flutter_secure_storage: ^10.0.0
  speech_to_text: ^7.4.0
  wakelock_plus: ^1.4.0
  workmanager: ^0.9.0+3
  # Pure-Dart gzip for the encrypted sync archive (no dart:io in domain code)
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

# Launcher icon recipe. The source artwork is original (crescent moon + star
# on night indigo, generated by tools/generate_launcher_icon.py). Regenerate
# the platform icons with:
#   dart run flutter_launcher_icons
# (Not wired into any build step on purpose — run it manually when the
# artwork changes and commit the results.)
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F1120"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
