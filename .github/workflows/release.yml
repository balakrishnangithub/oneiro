name: Release

# Tag a release to build a signed (or debug-keyed, if no secrets are set)
# APK and attach it to a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# For a properly signed APK, add these repository secrets
# (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64      base64 of your oneiro-upload-key.jks
#   KEYSTORE_PASSWORD    store password
#   KEY_ALIAS            upload
#   KEY_PASSWORD         key password

on:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore upload keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/oneiro-upload-key.jks
          cat > android/key.properties <<EOF
          storeFile=oneiro-upload-key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
